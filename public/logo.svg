<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cu-grad-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#197368" />
      <stop offset="100%" stop-color="#409d78" />
    </linearGradient>
    <linearGradient id="cu-grad-inner" x1="12" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#caece2" />
    </linearGradient>
    <filter id="cu-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#143a41" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#cu-grad-bg)" stroke="#caece2" stroke-width="1.5" stroke-opacity="0.3" filter="url(#cu-shadow)" />

  <!-- Stylized C Arc (Left & Top) -->
  <path d="M 28 14 C 18 14 13 19 13 24 C 13 29 18 34 28 34" stroke="url(#cu-grad-inner)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Stylized U & Ascending Growth Arrow (Right) -->
  <path d="M 23 20 L 23 27 C 23 30 26 31.5 29 30 C 32 28.5 35 24 35 15" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Ascending Spark / Star at Apex -->
  <path d="M 35 11 L 36.2 13.8 L 39 15 L 36.2 16.2 L 35 19 L 33.8 16.2 L 31 15 L 33.8 13.8 Z" fill="#caece2" />
</svg>